<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian Publisher - Admin Panel</title>
    
    <style>
      /* Base styles for HTML elements */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body, #app {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
          'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f3f4f6;
        color: #111827;
        transition: background-color 0.3s, color 0.3s;
      }

      .dark body {
        background: #1f2937;
        color: #f9fafb;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
      }

      input, textarea, select {
        font-family: inherit;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #999;">
        Loading...
      </div>
    </div>
    
    <!-- Main app script - Vite handles this -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
